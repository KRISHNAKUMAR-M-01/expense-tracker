<div class="card shadow-sm">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Transactions</h5>

        <!--Category Filter-->
        <select class="form-select form-select-sm w-auto fancy-select" [ngModel]="selectedCategory()"
            (ngModelChange)="selectedCategory.set($event)">
            <option value="All">All Categories</option>
            @for (c of categories; track c) {
            <option [value]="c">{{ c }}</option>
            }
        </select>
    </div>

    <!--Expense Table-->
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th>Date</th>
                    <th>Title</th>
                    <th>Category</th>
                    <th class="text-end">Amount</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>

            <tbody>

                <!--Expense Items-->
                @for (item of filteredExpenses(); track item.id) {
                <tr>
                    <td>{{ item.date | date: 'dd MMM yyyy '}}</td>
                    <td>{{ item.title }}</td>
                    <td>
                        <span class="badge bg-secondary">{{ item.category }}</span>
                    </td>
                    <td class="text-end fw-bold" [class.txt-success]="item.type === 'income'"
                        [class.text-danger]="item.type === 'expense'">
                        {{ item.type === 'income' ? '+' : '-' }}
                        {{ item.amount | currency: 'INR'}}
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-danger" (click)="onDelete(item.id)">
                            Delete
                        </button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td class="text-center text-muted py-4" colspan="5">
                        No transactions found.
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
